name: ScaleGrams CI
on:
  push:
    branches: [main, dev, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Require Docker for PostgreSQL 17 regression tests
        run: docker info > /dev/null
      - run: mvn -B clean verify
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: scalegrams-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set +e
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/projects/scalegrams/back/scalegrams-backend && git fetch origin main && git diff --quiet && git diff --cached --quiet && git checkout main && git pull --ff-only origin main && test \"\$(git rev-parse HEAD)\" = '${{ github.sha }}' && bash scripts/release-api.sh ${{ github.sha }}"
          deploy_status=$?
          if [ "$deploy_status" -ne 0 ]; then
            ssh "$VPS_USER@$VPS_HOST" "cd /opt/projects/scalegrams/back/scalegrams-backend && docker compose -f docker-compose.prod.yml ps app && docker compose -f docker-compose.prod.yml logs --no-color --tail=400 app 2>&1 | grep -E 'APPLICATION FAILED|Application run failed|Failed to start|Caused by:' | sed -E 's/(password|api.?key|token|secret)([^[:alnum:]]+)[^ ,;]+/\1\2[REDACTED]/Ig' | tail -n 60" || true
          fi
          exit "$deploy_status"
      - name: Verify API health on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          health="$(ssh "$VPS_USER@$VPS_HOST" "cd /opt/projects/scalegrams/back/scalegrams-backend && docker compose -f docker-compose.prod.yml exec -T app curl --fail --silent --show-error http://localhost:8081/api/health")"
          echo "$health"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<<"$health"
      - name: Verify published API revision
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          version="$(ssh "$VPS_USER@$VPS_HOST" 'curl --fail --silent --show-error --retry 6 --retry-delay 5 https://scalegrams.neticar.com.ar/api/version')"
          grep -Fq '${{ github.sha }}' <<<"$version"
